# Render Blueprint: Render -> New -> Blueprint -> pick this repository.
# The database is an external MySQL (e.g. Aiven free MySQL); Render itself only offers Postgres.
services:
  - type: web
    name: bazaar-panun
    runtime: node
    plan: free
    # Creates/updates the tables, loads the starting products if the database is empty, then builds.
    buildCommand: npm ci && npm run db:deploy && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/admin/session
    envVars:
      - key: DATABASE_URL
        sync: false # you enter this in the Render dashboard
      - key: DATABASE_CA_CERT
        sync: false # optional: the database provider's CA certificate
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
